services:
  # Nginx Load Balancer
  lb:
    image: nginx:alpine
    container_name: wargakonek-lb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

  # Instance 1
  app1:
    image: ${APP_IMAGE:-wargakonek-app:local}
    container_name: wargakonek-app-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Instance 2
  app2:
    image: ${APP_IMAGE:-wargakonek-app:local}
    container_name: wargakonek-app-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
