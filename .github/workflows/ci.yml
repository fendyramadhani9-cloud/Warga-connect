name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (if configured)
        run: npm run lint --if-present

      - name: Run Automated Tests
        run: npm test

  docker-test:
    name: Docker Build & Container Health Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: wargakonek-ci:${{ github.sha }}

      - name: Run Application Container
        run: |
          docker run -d \
            --name wargakonek-ci-test \
            -p 3000:3000 \
            wargakonek-ci:${{ github.sha }}

      - name: Verify Container Health Check Endpoint
        run: |
          echo "Menunggu container aktif dan siap menerima request..."
          HEALTH_URL="http://127.0.0.1:3000/api/health"
          MAX_RETRIES=15
          RETRY_COUNT=0
          
          until response=$(curl -s -w "\n%{http_code}" "$HEALTH_URL"); do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "❌ Health check timed out / server tidak merespon setelah $MAX_RETRIES percobaan."
              docker logs wargakonek-ci-test
              exit 1
            fi
            echo "Menunggu service... ($RETRY_COUNT/$MAX_RETRIES)"
            sleep 2
          done

          HTTP_CODE=$(echo "$response" | tail -n1)
          BODY=$(echo "$response" | sed '$d')

          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Health check gagal dengan status $HTTP_CODE"
            docker logs wargakonek-ci-test
            exit 1
          fi

          if ! echo "$BODY" | grep -q '"success":true'; then
            echo "❌ Response body tidak valid: tidak mengandung success:true"
            docker logs wargakonek-ci-test
            exit 1
          fi

          echo "✅ Container Health Check Sukses!"

      - name: Cleanup Container
        if: always()
        run: |
          docker rm -f wargakonek-ci-test || true
