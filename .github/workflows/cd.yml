name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      image_latest: ${{ steps.image_info.outputs.image_latest }}
      image_sha: ${{ steps.image_info.outputs.image_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Target Image Names
        id: image_info
        run: |
          # Lowercase repository owner for GHCR compatibility
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${OWNER}/wargakonek"
          
          # Compute commit SHA (support workflow_run or direct trigger)
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          
          echo "image_latest=${IMAGE_BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${IMAGE_BASE}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_info.outputs.image_latest }}
            ${{ steps.image_info.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy & Verify Production
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_IMAGE: ${{ needs.build-and-push.outputs.image_sha }}
          TARGET_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: TARGET_IMAGE,TARGET_PATH
          script: |
            set -e
            echo "===================================================="
            echo "🚀 MEMULAI DEPLOYMENT WARGAKONEK KE SERVER PRODUCTION"
            echo "Target Image: $TARGET_IMAGE"
            echo "Deploy Path : $TARGET_PATH"
            echo "===================================================="
            
            cd "$TARGET_PATH"
            
            # Export APP_IMAGE untuk docker compose
            export APP_IMAGE="$TARGET_IMAGE"
            
            echo "📥 [1/4] Menarik Docker Image dari GHCR..."
            docker compose pull app
            
            echo "🔄 [2/4] Menjalankan container baru..."
            docker compose up -d --remove-orphans app
            
            echo "🧹 [3/4] Membersihkan unused/dangling images..."
            docker image prune -f || true
            
            echo "🏥 [4/4] Menjalankan Production Health Check..."
            HEALTH_URL="http://127.0.0.1:3000/api/health"
            MAX_RETRIES=15
            RETRY_COUNT=0
            
            until response=$(curl -s -w "\n%{http_code}" "$HEALTH_URL"); do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "❌ Health check timed out / server tidak merespon setelah $MAX_RETRIES percobaan."
                docker compose logs --tail=50 app
                exit 1
              fi
              echo "Menunggu service production aktif... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep 2
            done

            HTTP_CODE=$(echo "$response" | tail -n1)
            BODY=$(echo "$response" | sed '$d')

            echo "HTTP Status Code: $HTTP_CODE"
            echo "Response Body: $BODY"

            if [ "$HTTP_CODE" -ne 200 ]; then
              echo "❌ Production health check gagal dengan HTTP code: $HTTP_CODE"
              docker compose logs --tail=50 app
              exit 1
            fi

            if ! echo "$BODY" | grep -q '"success":true'; then
              echo "❌ Response body production tidak valid: tidak mengandung success:true"
              docker compose logs --tail=50 app
              exit 1
            fi

            echo "===================================================="
            echo "✅ DEPLOYMENT & HEALTH CHECK PRODUCTION BERHASIL!"
            echo "===================================================="
            docker compose ps
